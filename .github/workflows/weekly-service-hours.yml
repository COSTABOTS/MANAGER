name: Weekly service hours isolated validation

on:
  push:
    branches:
      - feature/weekly-service-hours
      - feature/weekly-hours-availability
  workflow_dispatch:

jobs:
  isolated-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: weekly-test-password
          POSTGRES_DB: weekly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weekly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.9.7
      - name: Check weekly-hours helper
        run: deno check supabase/functions/_shared/booking-hours/weeklyHours.ts
      - name: Test weekly-hours helper
        run: deno test --allow-net supabase/functions/_shared/booking-hours/weeklyHours.test.ts
      - name: Check weekly-hours adapter
        run: deno check supabase/functions/_shared/booking-hours/weeklyHoursAdapter.ts
      - name: Check weekly-hours adapter tests
        run: deno check supabase/functions/_shared/booking-hours/weeklyHoursAdapter.test.ts
      - name: Test weekly-hours adapter
        run: deno test --allow-net supabase/functions/_shared/booking-hours/weeklyHoursAdapter.test.ts
      - name: Check availability regressions
        run: deno check --node-modules-dir=auto supabase/functions/public-api/routes/availabilityByDay.test.ts supabase/functions/_shared/reservation-store/supabaseReservationStore.test.ts
      - name: Test availability regressions
        run: deno test --node-modules-dir=auto --allow-net supabase/functions/public-api/routes/availabilityByDay.test.ts supabase/functions/_shared/reservation-store/supabaseReservationStore.test.ts
      - name: Test public restaurant 30-minute lead time
        # The global public-api typecheck has inherited errors in the base commit.
        # Run these focused tests without typechecking their unrelated imports.
        run: deno test --node-modules-dir=auto --no-check --allow-net supabase/functions/public-api/lib/reservations.test.ts supabase/functions/public-api/routes/publicReservationLeadTime.integration.test.ts
      - name: Test weekly reservation creation guard
        # reservationCreate.ts has inherited public-api type errors; --no-check does not skip test assertions.
        run: deno test --node-modules-dir=auto --no-check --allow-net supabase/functions/public-api/routes/reservationCreate.weekly.test.ts
      - name: Check Manager weekly-hours actions
        run: deno check supabase/functions/manager-api/weeklyHoursActions.test.ts tests/weeklyHoursDraft.test.ts tests/weeklyHoursPreview.test.ts tests/weeklyHoursPreviewDraft.test.ts tests/balinesePoolPreview.test.ts
      - name: Test Manager weekly-hours actions, draft and Preview gate
        run: deno test supabase/functions/manager-api/weeklyHoursActions.test.ts tests/weeklyHoursDraft.test.ts tests/weeklyHoursPreview.test.ts tests/weeklyHoursPreviewDraft.test.ts tests/balinesePoolPreview.test.ts
      - name: Check Manager pool-hours actions
        run: deno check supabase/functions/manager-api/poolHoursActions.test.ts
      - name: Test Manager pool-hours actions with isolated access
        run: deno test supabase/functions/manager-api/poolHoursActions.test.ts
      - name: Check pool-hours HTTP and remote-client tests
        run: deno check supabase/functions/manager-api/poolHoursHttp.test.ts tests/poolHoursRemote.test.ts
      - name: Test pool-hours HTTP and remote-client state
        run: deno test supabase/functions/manager-api/poolHoursHttp.test.ts tests/poolHoursRemote.test.ts
      - name: Check Manager CORS and Preview origin tests
        run: deno check supabase/functions/manager-api/cors.test.ts tests/weeklyHoursPreview.test.ts
      - name: Test Manager CORS and Preview origin gate
        run: deno test supabase/functions/manager-api/cors.test.ts tests/weeklyHoursPreview.test.ts
      - name: Prepare disposable PostgreSQL fixture
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_test -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/booking_service_hours_fixture.sql
      - name: Apply migration only to disposable PostgreSQL
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261025120000_booking_service_hours.sql
      - name: Run SQL assertions and rollback
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_test -v ON_ERROR_STOP=1 -v client_id=TEST-WEEKLY-HOURS -f supabase/tests/booking_service_hours_isolated.sql
      - name: Apply weekly-hours CAS only to disposable PostgreSQL
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261026120000_booking_service_hours_revision_cas.sql
      - name: Verify disposable Manager test database identity
        env:
          PGPASSWORD: weekly-test-password
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test -n "$POSTGRES_SERVICE_ID"
          service_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_SERVICE_ID")
          test -n "$service_ip"
          connection=$(psql -h 127.0.0.1 -U postgres -d weekly_test -v ON_ERROR_STOP=1 -At -F '|' -c "select current_database(), host(inet_server_addr()), current_setting('server_version_num')")
          IFS='|' read -r database server_ip version <<< "$connection"
          test "$database" = weekly_test
          test "$version" -ge 160000
          test "$version" -lt 170000
          test "$server_ip" = "$service_ip"
          echo "PGOPTIONS=-c costabots.weekly_test=gha-isolated-postgres16 -c costabots.weekly_server_ip=$service_ip" >> "$GITHUB_ENV"
      - name: Test Manager weekly-hours persistence and revision
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_test -v ON_ERROR_STOP=1 -f supabase/tests/weekly_hours_manager_persistence_isolated.sql
      - name: Test concurrent Manager weekly-hours saves
        shell: pwsh
        env:
          PGPASSWORD: weekly-test-password
        run: ./supabase/tests/weekly_hours_manager_concurrency.ps1 -PsqlPath (Get-Command psql).Source -Port 5432 -Database weekly_test
      - name: Apply pool-hours migration only to disposable PostgreSQL
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261027120000_booking_pool_hours.sql
      - name: Test isolated pool-hours persistence, permissions and transaction rollback
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_test -v ON_ERROR_STOP=1 -f supabase/tests/booking_pool_hours_isolated.sql
      - name: Test concurrent pool-hours saves in disposable PostgreSQL
        shell: pwsh
        env:
          PGPASSWORD: weekly-test-password
        run: ./supabase/tests/booking_pool_hours_concurrency.ps1 -PsqlPath (Get-Command psql).Source -Port 5432 -Database weekly_test
      - name: Test guarded pool-hours rollback in disposable PostgreSQL
        shell: pwsh
        env:
          PGPASSWORD: weekly-test-password
        run: ./supabase/tests/booking_pool_hours_rollback.ps1 -PsqlPath (Get-Command psql).Source -Port 5432 -Database weekly_test
      - name: Prepare separate disposable restaurant RPC database
        env:
          PGPASSWORD: weekly-test-password
        run: createdb -h 127.0.0.1 -U postgres weekly_rpc_test
      - name: Verify disposable PostgreSQL service identity
        env:
          PGPASSWORD: weekly-test-password
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test -n "$POSTGRES_SERVICE_ID"
          service_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_SERVICE_ID")
          test -n "$service_ip"
          connection=$(psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -At -F '|' -c "select current_database(), host(inet_server_addr()), current_setting('server_version_num')")
          IFS='|' read -r database server_ip version <<< "$connection"
          printf 'Disposable PostgreSQL: database=%s server=%s version=%s container=%s\n' "$database" "$server_ip" "$version" "${POSTGRES_SERVICE_ID:0:12}"
          test "$database" = weekly_rpc_test
          test "$version" -ge 160000
          test "$version" -lt 170000
          test "$server_ip" = "$service_ip"
          echo "PGOPTIONS=-c costabots.weekly_rpc_test=gha-isolated-postgres16 -c costabots.weekly_rpc_server_ip=$service_ip" >> "$GITHUB_ENV"
      - name: Apply disposable restaurant RPC fixture
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/weekly_reservation_rpc_fixture.sql
      - name: Apply versioned restaurant baseline in disposable PostgreSQL
        env:
          PGPASSWORD: weekly-test-password
        run: |
          psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260802110939_hospitality_phase1_schema.sql
          psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260802223000_hospitality_reservation_write_rpc.sql
          psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260813120000_hospitality_balinese_reservation_rpc.sql
          psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261025120000_booking_service_hours.sql
          psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261026120000_booking_service_hours_revision_cas.sql
      - name: Compare legacy behavior before weekly RPC migration
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/tests/weekly_reservation_rpc_legacy_comparison.sql
      - name: Apply proposed weekly RPC migration only in disposable PostgreSQL
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261025180000_weekly_hospitality_reservation_guard.sql
      - name: Compare legacy behavior after weekly RPC migration
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/tests/weekly_reservation_rpc_legacy_comparison.sql
      - name: Test weekly restaurant RPC and rollback assertions
        env:
          PGPASSWORD: weekly-test-password
        run: psql -h 127.0.0.1 -U postgres -d weekly_rpc_test -v ON_ERROR_STOP=1 -f supabase/tests/weekly_reservation_rpc_isolated.sql
      - name: Test weekly RPC concurrency in disposable PostgreSQL
        shell: pwsh
        env:
          PGPASSWORD: weekly-test-password
        run: ./supabase/tests/weekly_reservation_rpc_concurrency.ps1 -PsqlPath (Get-Command psql).Source -Port 5432 -Database weekly_rpc_test
